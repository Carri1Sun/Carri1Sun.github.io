favicon: /img/fluid.png
apple_touch_icon: /img/fluid.png

dark_mode:
  enable: true
  default: light

color:
  body_bg_color: "#f4f5f9"
  body_bg_color_dark: "#151823"
  navbar_bg_color: "#172033"
  navbar_bg_color_dark: "#111827"
  navbar_text_color: "#ffffff"
  navbar_text_color_dark: "#e5e7eb"
  subtitle_color: "#ffffff"
  subtitle_color_dark: "#e5e7eb"
  text_color: "#344054"
  text_color_dark: "#d0d5dd"
  sec_text_color: "#667085"
  sec_text_color_dark: "#98a2b3"
  board_color: "#ffffff"
  board_color_dark: "#202532"
  post_text_color: "#172033"
  post_text_color_dark: "#d0d5dd"
  post_heading_color: "#101828"
  post_heading_color_dark: "#f2f4f7"
  post_link_color: "#5267e8"
  post_link_color_dark: "#8b9cff"
  link_hover_color: "#3d4fbe"
  link_hover_color_dark: "#aab4ff"

font:
  font_size: 16px
  font_family: 'Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
  letter_spacing: 0.01em
  code_font_size: 85%

custom_css:
  - /css/custom.css

fun_features:
  typing:
    enable: true
    typeSpeed: 62
    cursorChar: "_"
    loop: false
    scope:
      - home
  anchorjs:
    enable: true
    element: h2,h3,h4
    placement: left
    visible: hover
    icon: "#"
  progressbar:
    enable: true
    height_px: 3
    color: "#5267e8"
    options: { showSpinner: false, trickleSpeed: 100 }

navbar:
  blog_title: "Kaiyi's Notes"
  ground_glass:
    enable: true
    px: 8
    alpha: 0.72
  menu:
    - { key: "home", name: "首页", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", name: "归档", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "about", name: "关于", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: true
  width_height_ratio: 1.0

footer:
  content: '
    <span>Kaiyi</span>
    <span class="with-love"><i class="iconfont icon-love"></i></span>
    <span>Ideas in progress</span>
    ·
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    /
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '
  statistics:
    enable: false

index:
  banner_img: /img/default.png
  banner_img_height: 76
  banner_mask_alpha: 0.22
  slogan:
    enable: true
    text: "在产品、工程与 Agent 之间，持续把问题想清楚。"
    api:
      enable: false
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

post:
  banner_img: /img/default.png
  banner_img_height: 58
  banner_mask_alpha: 0.28
  default_index_img:
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "LL"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 300
    views:
      enable: false
  updated:
    enable: false
  toc:
    enable: true
    headingSelector: "h2,h3"
    collapseDepth: 2
  comments:
    enable: false

archive:
  banner_img: /img/default.png
  banner_img_height: 52
  banner_mask_alpha: 0.3

about:
  enable: true
  title: "关于 Kaiyi"
  subtitle: "Product · Engineering · Agent"
  banner_img: /img/default.png
  banner_img_height: 52
  banner_mask_alpha: 0.3
  avatar: /img/avatar.png
  name: "Kaiyi"
  intro: "Product Manager at Tabbit Browser · Independent Contributor"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/Carri1Sun", tip: "GitHub" }

page404:
  enable: true
  banner_img: /img/default.png
  banner_img_height: 85
  banner_mask_alpha: 0.3
  redirect_delay: 5000
